<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0a;--p:#131313;--p2:#1b1b1b;--l:#2a2a2a;--t:#f4f4f2;--m:#9a9a94;--r:8px;box-sizing:border-box;padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0)}
*,*:before,*:after{box-sizing:inherit}html,body{height:100%;margin:0}html{scroll-padding-top:env(safe-area-inset-top,0)}
body{background:var(--bg);color:var(--t);font:15px/1.5 Inter,system-ui,sans-serif;overflow-x:hidden}
h1,h2,h3,.hd{font-family:"Space Grotesk",Inter,sans-serif;letter-spacing:-.02em;margin:0}
a{color:inherit;text-decoration:none}button,input,select{font:inherit;color:inherit}
button{cursor:pointer}:focus-visible{outline:2px solid #fff;outline-offset:2px}
.ic{width:18px;height:18px;flex:none}
.b{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border:1px solid var(--l);background:var(--p2);border-radius:var(--r);font-weight:600;white-space:nowrap}
.b:hover:not(:disabled){border-color:#555}.b:disabled{opacity:.35;cursor:default}
.b.pri{background:var(--t);color:#000;border-color:var(--t)}.b.pri:hover{background:#fff}.b.sm{min-height:36px;padding:0 12px}.b.dg{color:#ff8d7a}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
.nav{display:flex;align-items:center;gap:20px;height:64px;border-bottom:1px solid var(--l)}
.nav .sp,.tb .sp{flex:1}.nav a.l{color:var(--m);font-weight:500}.nav a.l:hover{color:var(--t)}
.logo{display:flex;align-items:center;gap:10px}.logo img{mix-blend-mode:lighten;display:block}.logo .mk{height:34px}.logo .wd{height:14px}
section{padding:72px 0}h2{font-size:clamp(26px,4vw,38px);line-height:1.1}.sub{color:var(--m);max-width:560px;margin:10px 0 0}
.hero{display:grid;grid-template-columns:1fr 1.1fr;gap:40px;align-items:center;padding:56px 0}
.hero h1{font-size:clamp(36px,6vw,64px);line-height:1.02}.hero p{color:var(--m);font-size:17px;max-width:480px}.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}
.line{display:flex;justify-content:center}.line .av{width:30%;max-width:190px;margin:0 -2%;border-radius:12px;overflow:hidden;border:1px solid var(--l)}.line .av:nth-child(2n){transform:translateY(24px)}
.av svg{display:block;width:100%;height:auto}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:32px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:32px}
.card{background:var(--p);border:1px solid var(--l);border-radius:var(--r);overflow:hidden;position:relative}.card .in{padding:14px}.card .av{border-bottom:1px solid var(--l)}
.step{padding:22px}.step b{font:700 13px "Space Grotesk";color:var(--m)}.step h3{margin:8px 0 6px;font-size:20px}.step p{margin:0;color:var(--m)}
.cats{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;margin-top:32px}.cats .card{text-align:center;padding-bottom:10px;font-weight:600;font-size:13px}.cats .av{border-radius:0}
.cta{text-align:center;border:1px solid var(--l);border-radius:12px;padding:56px 20px;background:var(--p)}.cta .row{justify-content:center}
footer{border-top:1px solid var(--l);padding:28px 0;color:var(--m);font-size:13px}footer .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
/* studio */
.stu{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr)}.mob .b:not([data-a=undo]):not([data-a=redo]) .ic,.mob .tx{display:none}.mob .menu{flex:1.4}.mob summary{width:100%}
.tb{display:flex;align-items:center;gap:8px;padding:8px 16px;border-bottom:1px solid var(--l);min-height:60px}
.nm{background:transparent;border:1px solid transparent;border-radius:var(--r);text-align:center;font:600 16px "Space Grotesk";min-height:40px;width:min(240px,34vw);padding:0 10px}.nm:hover,.nm:focus{border-color:var(--l);background:var(--p)}
.wk{display:grid;grid-template-columns:112px minmax(0,1fr) 380px;min-height:0}
.cn{display:flex;flex-direction:column;gap:4px;padding:12px;border-right:1px solid var(--l);overflow:auto}
.cn button{min-height:48px;border:1px solid transparent;background:none;border-radius:var(--r);color:var(--m);font-weight:600;padding:0 10px;text-align:left}
.cn button:hover{color:var(--t)}.cn button[aria-pressed=true]{background:var(--t);color:#000}
.pv{display:grid;grid-template-rows:minmax(0,1fr) auto;min-height:0;min-width:0}
.stage{display:grid;place-items:center;overflow:hidden;padding:20px;min-height:0;background:radial-gradient(#1c1c1c 1px,transparent 1px) 0 0/22px 22px}.nogrid .stage{background:none}
.frame{height:100%;max-height:660px;max-width:100%;aspect-ratio:200/260;border-radius:14px;overflow:hidden;border:1px solid var(--l);transition:transform .2s}
.frame svg{width:100%;height:100%;display:block}.pop svg{animation:pop .28s ease-out}@keyframes pop{50%{transform:scale(1.025)}}.nomo .pop svg{animation:none}
.ctl{display:flex;align-items:center;justify-content:center;gap:8px;padding:10px;border-top:1px solid var(--l);flex-wrap:wrap}
.sw{width:28px;height:28px;border-radius:50%;border:2px solid var(--l);padding:0}.sw[aria-pressed=true]{outline:2px solid #fff;outline-offset:2px}
.pan{border-left:1px solid var(--l);overflow:auto;padding:16px}.pan h3{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--m);margin:18px 0 10px}.pan h3:first-child{margin-top:0}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.cols{display:flex;flex-wrap:wrap;gap:10px}
.opt{border:1px solid var(--l);background:var(--p);border-radius:var(--r);padding:0;overflow:hidden;color:var(--m);font-size:12px;font-weight:500}
.opt[aria-pressed=true]{border-color:#fff;color:var(--t);box-shadow:0 0 0 1px #fff}.opt .av{aspect-ratio:1;overflow:hidden}.opt .av svg{height:100%;width:100%}.opt span{display:block;padding:6px 4px;text-align:center}
.cs{width:44px;height:44px;border-radius:50%;border:2px solid var(--l);padding:0}.cs[aria-pressed=true]{outline:2px solid #fff;outline-offset:2px}
.mob{display:none;grid-row:2}.menu{position:relative}.menu summary{list-style:none}.menu summary::-webkit-details-marker{display:none}
.menu .pp{position:absolute;right:0;top:calc(100% + 6px);z-index:30;background:var(--p2);border:1px solid var(--l);border-radius:var(--r);padding:6px;min-width:190px;display:grid;gap:2px}
.menu .pp button,.menu .pp a{min-height:42px;border:0;background:none;text-align:left;padding:0 12px;border-radius:6px;font-weight:500;display:flex;align-items:center}.menu .pp button:hover,.menu .pp a:hover{background:#2a2a2a}
.fs{position:fixed;inset:0;z-index:50;background:var(--bg)}.fs .frame{max-height:90vh}
/* pages */
.pg{padding:32px 0 80px}.ph{display:flex;align-items:end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:24px}.ph h1{font-size:34px}.ph p{margin:4px 0 0;color:var(--m)}
.cg{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}.card .t{font-weight:600}.card .d{color:var(--m);font-size:13px}.card .ac{display:flex;gap:6px;margin-top:12px;align-items:center}.card .ac .b{flex:1}
.empty{text-align:center;border:1px dashed #3a3a3a;border-radius:12px;padding:56px 20px}.empty .av{width:140px;margin:0 auto 18px;border-radius:12px;overflow:hidden}
.view{display:grid;place-items:center;gap:16px;text-align:center;padding:24px 0}.view .frame{height:min(62dvh,640px)}
.set{max-width:640px}.set section{padding:0 0 28px;margin-bottom:28px;border-bottom:1px solid var(--l)}.set h3{margin-bottom:12px}
.fr{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:48px}.fr input[type=text],.fr select,.fld{background:var(--p);border:1px solid var(--l);border-radius:var(--r);min-height:44px;padding:0 12px;width:min(260px,100%)}
.tg{width:48px;height:28px;border-radius:99px;background:#333;border:0;position:relative;padding:0}.tg:after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.15s}.tg[aria-pressed=true]{background:#4aa86a}.tg[aria-pressed=true]:after{left:23px}
.ov{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.7);display:grid;place-items:center;padding:16px}
.md{background:var(--p);border:1px solid var(--l);border-radius:12px;width:min(760px,100%);max-height:92dvh;overflow:auto;padding:22px}.md h2{font-size:24px;margin-bottom:14px}
.ex{display:grid;grid-template-columns:1fr 1fr;gap:22px}.ex .frame{height:auto;width:100%}.seg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}.seg .b[aria-pressed=true]{background:var(--t);color:#000}.lb{font-size:12px;color:var(--m);text-transform:uppercase;letter-spacing:.08em;margin:0 0 8px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--t);color:#000;padding:12px 18px;border-radius:var(--r);font-weight:600;z-index:90}

.wk{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto auto}.cn{flex-direction:row;order:2;border-right:0;border-top:1px solid var(--l);overflow-x:auto;padding:8px}.cn button{flex:none;text-align:center;min-width:88px}

const Prev=id=>{const a=AV.find(x=>x.id==id);if(!a)return Avs();return Nav()+`<div class="wrap pg"><a class="d" href="#/avatars" style="color:var(--m)">← My Avatars</a><div class="view"><div class="frame">${av(a)}</div><div><h1>${esc(a.name)}</h1><p class="d" style="color:var(--m);margin:4px 0 0">Updated ${fmtD(a.updated)} · ${cap(a.expression)}</p></div><div class="row" style="justify-content:center;margin:0"><a class="b pri" href="#/studio/${a.id}">Edit</a><button class="b" data-a="dup" data-v="${a.id}">Duplicate</button><button class="b" data-a="exp" data-v="${a.id}">Export</button><button class="b" data-a="share">Share</button><button class="b dg" data-a="del" data-v="${a.id}">Delete</button></div></div></div>`};
const Tog=(k,l)=>`<div class="fr"><span>${l}</span><button class="tg" role="switch" aria-label="${l}" aria-pressed="${!!ST[k]}" data-a="tog" data-v="${k}"></button></div>`;
const Sets=()=>Nav()+`<div class="wrap pg set"><div class="ph"><h1>Settings</h1></div><section><h3>Account</h3><div class="fr"><label for="sn">Display name</label><input id="sn" type="text" value="${esc(ST.name)}" data-a="set" data-v="name" placeholder="Your name"></div><div class="fr"><label for="se">Email</label><input id="se" type="text" value="${esc(ST.email)}" data-a="set" data-v="email" placeholder="you@example.com"></div></section><section><h3>Appearance</h3>${Tog('motion','Reduce motion')}</section><section><h3>Editor preferences</h3>${Tog('grid','Show grid behind avatar')}${Tog('confirm','Confirm before deleting')}</section><section><h3>Export preferences</h3><div class="fr"><label for="sf">Default format</label><select id="sf" data-a="set" data-v="fmt"><option value="png" ${ST.fmt=='png'?'selected':''}>PNG</option><option value="tpng" ${ST.fmt=='tpng'?'selected':''}>Transparent PNG</option></select></div><div class="fr"><label for="sz">Default size</label><select id="sz" data-a="set" data-v="size">${[256,512,1024].map(n=>`<option ${ST.size==n?'selected':''}>${n}</option>`).join('')}</select></div></section></div>`;
function route(){const h=location.hash.slice(2).split('/'),a=$('#app');document.body.classList.toggle('nomo',!!ST.motion);let v;
if(h[0]=='studio'){if(!AV.find(x=>x.id==h[1]))return location.hash='#/avatars';if(!W||W.id!=h[1])open(h[1]);v=studio()}
else v=h[0]=='avatars'?Avs():h[0]=='a'?Prev(h[1]):h[0]=='settings'?Sets():Land();
a.innerHTML=v;const p=$('.pan');if(p)p.scrollTop=+p.dataset.k||0;if(!h[0])scrollTo(0,0)}
const nameModal=(t,val,act,id)=>modal(`<h2>${t}</h2><input class="fld" id="nmi" value="${esc(val)}" maxlength="30" aria-label="Avatar name" style="width:100%"><div class="row"><button class="b pri" data-a="${act}" data-v="${id||''}">Continue</button><button class="b" data-a="close">Cancel</button></div>`);
const nv=()=>($('#nmi').value.trim()||'Untitled');
/* ---- events ---- */
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el||el.tagName=='INPUT'||el.tagName=='SELECT')return;const A=el.dataset.a,v=el.dataset.v,live=location.hash.includes('studio');
const ch=()=>{commit();route()};
({close,go:()=>{setTimeout(()=>document.getElementById(v)?.scrollIntoView({behavior:'smooth'}),30)},
new:()=>nameModal('Name your avatar','Character '+String(AV.length+1).padStart(2,'0'),'mk'),
mk:()=>{const c=newCfg(nv());AV.unshift(c);sav();close();location.hash='#/studio/'+c.id},
cat:()=>{cat=v;route()},opt:()=>{const g=CATS.flatMap(x=>x.g)[+el.dataset.g];W=withOpt(W,g,v);ch()},
undo:()=>{if(hp>0){W=JSON.parse(H[--hp]);route()}},redo:()=>{if(hp<H.length-1){W=JSON.parse(H[++hp]);route()}},
rand:()=>{el.closest('details')?.removeAttribute('open');W=rand(W,v);ch()},
save:()=>{W.updated=Date.now();const i=AV.findIndex(a=>a.id==W.id);AV[i]=cl(W);sav();toast('Saved '+W.name)},
zoom:()=>{zoom=v==0?1:Math.min(2,Math.max(.5,zoom+ +v));route()},fs:()=>{fs=!fs;route()},
dup:()=>{const s=AV.find(a=>a.id==v),c={...cl(s),id:newCfg().id,name:s.name+' copy',updated:Date.now()};AV.unshift(c);sav();toast('Duplicated');route()},
ren:()=>nameModal('Rename avatar',AV.find(a=>a.id==v).name,'rn',v),rn:()=>{AV.find(a=>a.id==v).name=nv();sav();close();route()},
del:()=>{const d=()=>{AV=AV.filter(a=>a.id!=v);sav();close();toast('Deleted');location.hash.includes('/a/')?location.hash='#/avatars':route()};ST.confirm?(modal(`<h2>Delete this avatar?</h2><p class="sub">This can't be undone.</p><div class="row"><button class="b dg" data-a="dd" data-v="${v}">Delete</button><button class="b" data-a="close">Cancel</button></div>`)):d()},
dd:()=>{AV=AV.filter(a=>a.id!=v);sav();close();toast('Deleted');location.hash.includes('/a/')?location.hash='#/avatars':route()},
exp:()=>{X={...X,id:v,bg:'cur',busy:0};exModal()},x:()=>{const k=el.dataset.k;k=='bg'?X.bg=v:ST[k]=isNaN(v)?v:+v;SV('pxzel.set',ST);exModal()},doex:doExport,
tog:()=>{ST[v]=ST[v]?0:1;SV('pxzel.set',ST);route()},share:()=>{navigator.clipboard?.writeText(location.href);toast('Link copied')}}[A]||(()=>{}))()});
document.addEventListener('change',e=>{const el=e.target,A=el.dataset.a;if(A=='name'){W.name=el.value.trim()||'Untitled'}if(A=='sol'){X.sol=el.value;exModal()}if(A=='set'){ST[el.dataset.v]=el.dataset.v=='size'?+el.value:el.value;SV('pxzel.set',ST)}});
document.addEventListener('input',e=>{if(e.target.dataset.a=='sol'){X.sol=e.target.value}});
document.addEventListener('keydown',e=>{if(e.key=='Escape'){close();if(fs){fs=0;route()}}if(location.hash.includes('studio')&&(e.metaKey||e.ctrlKey)&&e.key=='z'&&!/INPUT/.test(e.target.tagName)){e.preventDefault();(e.shiftKey?$('[data-a=redo]'):$('[data-a=undo]'))?.click()}});
addEventListener('hashchange',()=>{close();fs=0;route()});route();
</script></body></html>
